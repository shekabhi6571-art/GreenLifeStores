<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account & Checkout | GreenLifeStores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-green-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="products.html" class="text-2xl font-bold text-green-700 flex items-center gap-2">
                <i class="fa-solid fa-leaf"></i> GreenLifeStores
            </a>
            <nav class="flex gap-6 font-medium text-gray-600">
                <a href="products.html" class="hover:text-green-600">Shop</a>
                <a href="about.html" class="hover:text-green-600">About</a>
                <a href="account.html" class="text-green-600 font-semibold">Account</a>
                <a href="admin.html" class="hover:text-green-600">Admin</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <!-- Checkout Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8 border border-green-100">
            <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-truck-fast"></i> Complete Your Order
            </h2>
            
            <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="cust-name" required placeholder="Abhishek Yadav" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                        <input type="tel" id="cust-phone" required placeholder="9801557358" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Delivery Address</label>
                    <input type="text" id="cust-address" required placeholder="House No, Building, Street" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">City</label>
                        <input type="text" id="cust-city" required placeholder="Mumbai" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Pincode</label>
                        <input type="text" id="cust-pincode" required placeholder="400001" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>

                <div id="checkout-summary" class="bg-green-50 p-4 rounded-xl border border-green-200 mt-4">
                    <p class="font-bold text-gray-700 mb-1">Order Items Summary:</p>
                    <div id="checkout-items-list" class="text-sm text-gray-600 mb-2"></div>
                    <p class="text-lg font-bold text-green-700">Total Payable Amount: <span id="checkout-total">₹0</span></p>
                </div>

                <button type="submit" class="w-full bg-green-700 text-white py-3 rounded-xl font-bold hover:bg-green-800 transition shadow-md">
                    Place Order (Cash on Delivery)
                </button>
            </form>
        </div>

        <!-- My Orders History Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 border border-green-100">
            <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-box-open"></i> My Order History
            </h2>
            <div id="orders-container" class="space-y-4">
                <p class="text-gray-500 text-center py-4">Loading your orders...</p>
            </div>
        </div>
    </main>

    <script>
        const cart = JSON.parse(localStorage.getItem("greenlife_cart")) || [];

        function renderCheckoutSummary() {
            const listElem = document.getElementById('checkout-items-list');
            const totalElem = document.getElementById('checkout-total');

            if (cart.length === 0) {
                listElem.innerHTML = `<span class="text-red-500 font-semibold">Your cart is empty. Please add products from shop page.</span>`;
                totalElem.innerText = "₹0";
                return;
            }

            let total = 0;
            listElem.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `• <strong>${item.name}</strong> x ${item.qty} (₹${item.price * item.qty})`;
            }).join('<br>');

            totalElem.innerText = `₹${total}`;
        }

        async function handleCheckout(event) {
            event.preventDefault();
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const payload = {
                customer_name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value,
                city: document.getElementById('cust-city').value,
                pincode: document.getElementById('cust-pincode').value,
                total_amount: totalAmount,
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    qty: item.qty
                }))
            };

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();

                if (resData.status === 'success') {
                    alert(`🎉 Order Placed Successfully!\n\nOrder ID: #${resData.order_id}\nTotal Amount: ₹${totalAmount}\n\nSMS notification has been triggered.`);
                    localStorage.removeItem("greenlife_cart");
                    location.reload();
                } else {
                    alert("Error placing order.");
                }
            } catch (err) {
                console.error("Checkout error:", err);
                alert("Failed to connect to server.");
            }
        }

        async function loadMyOrders() {
            try {
                const response = await fetch('/api/customer/orders');
                const orders = await response.json();
                const container = document.getElementById('orders-container');

                if (!orders || orders.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 text-center py-6">No orders placed yet.</p>`;
                    return;
                }

                container.innerHTML = orders.slice().reverse().map(order => `
                    <div class="border rounded-xl p-5 bg-green-50/50 shadow-sm hover:shadow transition">
                        <div class="flex justify-between items-center border-b pb-3 mb-3">
                            <span class="font-bold text-green-800 text-lg">Order #${order.id}</span>
                            <span class="bg-green-600 text-white text-sm font-semibold px-3 py-1 rounded-full">₹${order.total}</span>
                        </div>
                        <p class="text-sm text-gray-700 mb-2"><strong>Customer:</strong> ${order.customer_name || 'Abhishek'} (${order.phone || 'N/A'})</p>
                        <p class="text-sm text-gray-700 mb-3"><strong>Delivery Address:</strong> ${order.address}</p>
                        <div class="bg-white p-3 rounded-lg border">
                            <p class="font-bold text-xs text-gray-500 uppercase mb-2">Ordered Items:</p>
                            <ul class="space-y-1 text-sm text-gray-800">
                                ${order.items.map(i => `<li class="flex justify-between"><span>• ${i.name}</span> <span class="font-semibold">Qty: ${i.quantity}</span></li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading orders:", err);
            }
        }

        window.onload = () => {
            renderCheckoutSummary();
            loadMyOrders();
        };
    </script>
</body>
</html>
