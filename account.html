<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account & Checkout | GreenLifeStores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-green-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="products.html" class="text-2xl font-bold text-green-700 flex items-center gap-2">
                <i class="fa-solid fa-leaf"></i> GreenLifeStores
            </a>
            <nav class="flex gap-6 font-medium text-gray-600">
                <a href="products.html" class="hover:text-green-600">Shop</a>
                <a href="about.html" class="hover:text-green-600">About</a>
                <a href="orders.html" class="hover:text-green-600">My Orders</a>
                <a href="account.html" class="text-green-600 font-semibold">Account</a>
                <a href="admin.html" class="hover:text-green-600">Admin</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <!-- Checkout Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8 border border-green-100">
            <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-truck-fast"></i> Complete Your Order
            </h2>
            
            <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="cust-name" required placeholder="Abhishek Yadav" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                        <input type="tel" id="cust-phone" required placeholder="9801557358" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Delivery Address</label>
                    <input type="text" id="cust-address" required placeholder="House No, Building, Street" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">City</label>
                        <input type="text" id="cust-city" required placeholder="Mumbai" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Pincode</label>
                        <input type="text" id="cust-pincode" required placeholder="400001" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>

                <div id="checkout-summary" class="bg-green-50 p-4 rounded-xl border border-green-200 mt-4">
                    <p class="font-bold text-gray-700 mb-1">Order Items Summary:</p>
                    <div id="checkout-items-list" class="text-sm text-gray-600 mb-2"></div>
                    <p class="text-lg font-bold text-green-700">Total Payable Amount: <span id="checkout-total">₹0</span></p>
                </div>

                <button id="place-order-button" type="submit" disabled class="w-full bg-green-700 text-white py-3 rounded-xl font-bold hover:bg-green-800 transition shadow-md disabled:cursor-not-allowed disabled:opacity-50">
                    Place Order (Cash on Delivery)
                </button>
                <div id="empty-cart-action" class="hidden text-center text-sm text-gray-600">
                    Add products to your cart before checking out.
                    <a href="products.html" class="font-semibold text-green-700 underline hover:text-green-800">Go to Shop</a>
                </div>
            </form>
        </div>

        <div class="text-center">
            <a href="orders.html" class="inline-flex items-center gap-2 font-semibold text-green-700 hover:text-green-800">
                <i class="fa-solid fa-box-open"></i> View your orders
            </a>
        </div>
    </main>

    <script>
        let cart = [];
        let cartReadError = null;

        function readCart() {
            cartReadError = null;
            try {
                const storedCart = localStorage.getItem("greenlife_cart");
                const parsedCart = storedCart ? JSON.parse(storedCart) : [];
                if (!Array.isArray(parsedCart)) {
                    throw new TypeError("Saved cart is not in the expected format.");
                }
                if (parsedCart.some(item =>
                    !item ||
                    !Number.isFinite(Number(item.price)) ||
                    Number(item.price) < 0 ||
                    !Number.isInteger(Number(item.qty)) ||
                    Number(item.qty) < 1
                )) {
                    throw new TypeError("One or more saved cart items are invalid.");
                }
                cart = parsedCart;
            } catch (error) {
                cart = [];
                cartReadError = error;
                console.error("Unable to read saved cart:", error);
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function renderCheckoutSummary() {
            const listElem = document.getElementById('checkout-items-list');
            const totalElem = document.getElementById('checkout-total');
            const placeOrderButton = document.getElementById('place-order-button');
            const emptyCartAction = document.getElementById('empty-cart-action');

            readCart();

            if (cart.length === 0) {
                listElem.innerHTML = cartReadError
                    ? `<span class="text-red-500 font-semibold">Your saved cart could not be read. Please check your cart and try again.</span>`
                    : `<span class="text-gray-600">Your cart is empty.</span>`;
                totalElem.innerText = "₹0";
                placeOrderButton.disabled = true;
                emptyCartAction.classList.remove('hidden');
                return;
            }

            let total = 0;
            listElem.innerHTML = cart.map(item => {
                const subtotal = Number(item.price) * Number(item.qty);
                total += subtotal;
                return `• <strong>${escapeHtml(item.name || 'Item')}</strong> x ${Number(item.qty)} (${new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(subtotal)})`;
            }).join('<br>');

            totalElem.innerText = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(total);
            placeOrderButton.disabled = false;
            emptyCartAction.classList.add('hidden');
        }

        async function handleCheckout(event) {
            event.preventDefault();
            renderCheckoutSummary();
            if (cart.length === 0) {
                alert(cartReadError ? "Your saved cart could not be read. Please check your cart and try again." : "Your cart is empty. Please add products before placing an order.");
                return;
            }

            let savedOrders;
            try {
                const storedOrders = localStorage.getItem('greenlife_user_orders');
                savedOrders = storedOrders ? JSON.parse(storedOrders) : [];
                if (!Array.isArray(savedOrders)) {
                    throw new TypeError('Saved order history is not in the expected format.');
                }
            } catch (err) {
                console.error("Unable to read saved orders:", err);
                alert("Unable to access your saved order history. Your order was not placed; please check your browser storage and try again.");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const payload = {
                name: document.getElementById('cust-name').value.trim(),
                phone: document.getElementById('cust-phone').value.trim(),
                address: [
                    document.getElementById('cust-address').value.trim(),
                    document.getElementById('cust-city').value.trim(),
                    document.getElementById('cust-pincode').value.trim()
                ].filter(Boolean).join(', '),
                payment_method: 'COD',
                total_amount: totalAmount,
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    qty: item.qty
                }))
            };

            let acceptedOrderId = null;
            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();

                if (!response.ok || resData.status !== 'success') {
                    throw new Error(resData.detail || resData.message || 'Error placing order.');
                }
                acceptedOrderId = resData.order_id;

                savedOrders.push({
                    order_id: resData.order_id,
                    order_date: new Date().toISOString(),
                    name: payload.name,
                    phone: payload.phone,
                    address: payload.address,
                    payment_method: payload.payment_method,
                    items: payload.items.map(item => ({
                        ...item,
                        quantity: item.qty,
                        subtotal: item.price * item.qty
                    })),
                    total_amount: payload.total_amount,
                    status: '3-5 Days Delivery'
                });
                localStorage.setItem('greenlife_user_orders', JSON.stringify(savedOrders));
                localStorage.removeItem("greenlife_cart");
                alert(`Order placed successfully!\n\nOrder ID: #${resData.order_id}\nTotal Amount: ₹${totalAmount}`);
                window.location.href = 'orders.html';
            } catch (err) {
                console.error("Checkout error:", err);
                if (acceptedOrderId !== null) {
                    alert(`Order #${acceptedOrderId} was accepted, but could not be saved in this browser. Please don't submit it again; contact us to confirm your order.`);
                } else {
                    alert(err instanceof Error ? err.message : "Failed to place order. Please try again.");
                }
            }
        }

        window.onload = () => {
            renderCheckoutSummary();
        };

        window.addEventListener('storage', event => {
            if (event.key === 'greenlife_cart') {
                renderCheckoutSummary();
            }
        });
    </script>
</body>
</html>
