<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | GreenLifeStores</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-emerald-50/40 font-sans text-gray-800">
  <header class="sticky top-0 z-40 border-b border-gray-100 bg-white shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
      <a href="products.html" class="flex items-center gap-2 text-xl font-bold text-emerald-700">
        <i class="fa-solid fa-leaf text-green-600"></i>
        GreenLifeStores
      </a>
      <nav class="flex items-center gap-4 text-sm font-medium text-gray-600 sm:gap-6">
        <a href="products.html" class="transition hover:text-green-600">Shop</a>
        <a href="account.html" class="transition hover:text-green-600">Account</a>
        <span class="font-semibold text-green-700" aria-current="page">My Orders</span>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-10 sm:py-14">
    <div class="mb-8 text-center">
      <span class="mb-3 inline-flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-2xl text-emerald-700">
        <i class="fa-solid fa-box-open"></i>
      </span>
      <h1 class="text-3xl font-bold text-emerald-800 sm:text-4xl">My Orders</h1>
      <p class="mt-2 text-sm text-gray-600">Your GreenLifeStores purchases, all in one place.</p>
    </div>

    <section id="orders-container" class="space-y-5" aria-live="polite"></section>
  </main>

  <script>
    const ordersContainer = document.getElementById('orders-container');

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function formatCurrency(value) {
      const amount = Number(value);
      return `₹${Number.isFinite(amount) ? amount.toLocaleString('en-IN') : '0'}`;
    }

    function renderEmptyOrders() {
      ordersContainer.innerHTML = `
        <div class="rounded-2xl border border-green-100 bg-white px-6 py-12 text-center shadow-sm">
          <span class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-green-50 text-2xl text-green-600">
            <i class="fa-solid fa-basket-shopping"></i>
          </span>
          <h2 class="text-xl font-bold text-emerald-800">No orders yet</h2>
          <p class="mt-2 text-sm text-gray-600">When you place an order, its details will appear here.</p>
          <a href="products.html" class="mt-6 inline-flex items-center gap-2 rounded-lg bg-emerald-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-green-600">
            <i class="fa-solid fa-leaf"></i> Start Shopping
          </a>
        </div>`;
    }

    function renderOrder(order, index) {
      const items = Array.isArray(order.items) ? order.items : [];
      const orderNumber = order.order_id ?? order.id ?? index + 1;
      const dateValue = order.order_date || order.date || order.created_at;
      const parsedDate = dateValue ? new Date(dateValue) : null;
      const dateLabel = parsedDate && !Number.isNaN(parsedDate.getTime())
        ? parsedDate.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })
        : 'Date unavailable';
      const customerName = order.name || order.customer_name || 'Not provided';
      const phone = order.phone || 'Not provided';
      const address = order.address || 'Not provided';
      const paymentMethod = String(order.payment_method || 'COD').toUpperCase();
      const paymentBadge = paymentMethod === 'UPI'
        ? 'bg-violet-100 text-violet-800'
        : 'bg-amber-100 text-amber-800';
      const orderItems = items.length
        ? items.map(item => {
            const quantity = Number(item.quantity ?? item.qty ?? 1);
            const subtotal = item.subtotal ?? Number(item.price || 0) * quantity;
            return `
              <li class="flex items-start justify-between gap-4 py-3">
                <span class="min-w-0 text-sm text-gray-700">
                  ${escapeHtml(item.name || 'Item')}
                  <span class="ml-1 text-gray-500">× ${escapeHtml(quantity)}</span>
                </span>
                <span class="shrink-0 text-sm font-semibold text-gray-800">${formatCurrency(subtotal)}</span>
              </li>`;
          }).join('')
        : '<li class="py-3 text-sm text-gray-500">Item details unavailable.</li>';
      const total = order.total_amount ?? order.total ?? items.reduce((sum, item) => {
        const quantity = Number(item.quantity ?? item.qty ?? 1);
        return sum + Number(item.subtotal ?? Number(item.price || 0) * quantity);
      }, 0);

      return `
        <article class="overflow-hidden rounded-2xl border border-green-100 bg-white shadow-sm">
          <div class="flex flex-col gap-3 border-b border-green-100 bg-green-50/70 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
            <div>
              <h2 class="text-lg font-bold text-emerald-800">Order #${escapeHtml(orderNumber)}</h2>
              <p class="mt-1 text-sm text-gray-600"><i class="fa-regular fa-calendar mr-1.5 text-green-700"></i>${escapeHtml(dateLabel)}</p>
            </div>
            <span class="inline-flex w-fit items-center gap-2 rounded-full bg-green-100 px-3 py-1.5 text-xs font-semibold text-green-800">
              <i class="fa-solid fa-truck-fast"></i> 3-5 Days Delivery
            </span>
          </div>

          <div class="grid gap-5 px-5 py-5 sm:grid-cols-2 sm:px-6">
            <div class="space-y-3 text-sm">
              <p class="flex gap-2"><i class="fa-solid fa-user mt-0.5 w-4 text-green-700"></i><span><strong>Customer:</strong> ${escapeHtml(customerName)}</span></p>
              <p class="flex gap-2"><i class="fa-solid fa-phone mt-0.5 w-4 text-green-700"></i><span><strong>Phone:</strong> ${escapeHtml(phone)}</span></p>
              <p class="flex gap-2"><i class="fa-solid fa-location-dot mt-0.5 w-4 text-green-700"></i><span><strong>Delivery Address:</strong> ${escapeHtml(address)}</span></p>
              <p class="flex items-center gap-2">
                <i class="fa-solid fa-credit-card w-4 text-green-700"></i>
                <strong>Payment:</strong>
                <span class="rounded-full px-2.5 py-1 text-xs font-bold ${paymentBadge}">${escapeHtml(paymentMethod)}</span>
              </p>
            </div>

            <div class="rounded-xl border border-gray-100 bg-gray-50 px-4">
              <h3 class="border-b border-gray-200 py-3 text-xs font-bold uppercase tracking-wider text-gray-500">Ordered Items</h3>
              <ul class="divide-y divide-gray-200">${orderItems}</ul>
            </div>
          </div>

          <div class="flex items-center justify-between border-t border-green-100 bg-white px-5 py-4 sm:px-6">
            <span class="font-semibold text-gray-700">Total Amount</span>
            <span class="text-lg font-bold text-emerald-700">${formatCurrency(total)}</span>
          </div>
        </article>`;
    }

    function loadOrders() {
      try {
        const storedOrders = localStorage.getItem('greenlife_user_orders');
        const orders = storedOrders ? JSON.parse(storedOrders) : [];
        if (!Array.isArray(orders)) {
          throw new TypeError('Saved order history is not in the expected format.');
        }
        if (orders.length === 0) {
          renderEmptyOrders();
          return;
        }
        ordersContainer.innerHTML = orders.slice().reverse().map((order, index) => (
          renderOrder(order && typeof order === 'object' ? order : {}, orders.length - index - 1)
        )).join('');
      } catch (error) {
        console.error('Unable to load saved orders:', error);
        ordersContainer.innerHTML = `
          <div role="alert" class="rounded-2xl border border-red-200 bg-white p-6 text-center text-sm text-red-700">
            We couldn't read your saved order history. Please check your browser storage and reload this page.
          </div>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
