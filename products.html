<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | GreenLifeStores</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-green-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="products.html" class="text-2xl font-bold text-green-700 flex items-center gap-2">
                <i class="fa-solid fa-leaf"></i> GreenLifeStores
            </a>
            <nav class="hidden md:flex gap-6 font-medium text-gray-600">
                <a href="products.html" class="text-green-600 font-semibold">Shop</a>
                <a href="about.html" class="hover:text-green-600">About</a>
                <a href="account.html" class="hover:text-green-600">Account</a>
                <a href="admin.html" class="hover:text-green-600">Admin</a>
            </nav>
            <div class="flex items-center gap-4">
                <button onclick="openCartModal()" class="relative bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Cart <span id="cart-count" class="bg-white text-green-700 font-bold px-2 py-0.5 rounded-full text-xs">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Hero Section -->
        <div class="bg-green-700 text-white rounded-2xl p-8 mb-8 text-center shadow-lg">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">Sustainable & Eco-Friendly Living</h1>
            <p class="text-green-100 max-w-xl mx-auto">Explore our collection of handcrafted terracotta, bamboo, and natural organic lifestyle products.</p>
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap justify-center gap-3 mb-8">
            <button onclick="filterCategory('all')" class="category-btn active px-5 py-2 rounded-full bg-green-600 text-white font-medium shadow transition">All Products</button>
            <button onclick="filterCategory('soil')" class="category-btn px-5 py-2 rounded-full bg-white text-gray-700 font-medium shadow hover:bg-green-100 transition">Clay & Soil</button>
            <button onclick="filterCategory('care')" class="category-btn px-5 py-2 rounded-full bg-white text-gray-700 font-medium shadow hover:bg-green-100 transition">Personal Care</button>
            <button onclick="filterCategory('decor')" class="category-btn px-5 py-2 rounded-full bg-white text-gray-700 font-medium shadow hover:bg-green-100 transition">Home Decor</button>
            <button onclick="filterCategory('kitchen')" class="category-btn px-5 py-2 rounded-full bg-white text-gray-700 font-medium shadow hover:bg-green-100 transition">Kitchenware</button>
        </div>

        <!-- Products Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamically Loaded Products -->
        </div>
    </main>

    <!-- Cart Drawer Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-cart-shopping text-green-600 mr-2"></i> Your Shopping Cart</h2>
                <button onclick="closeCartModal()" class="text-gray-500 hover:text-red-500 text-xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-grow space-y-4 mb-4">
                <!-- Cart items rendered dynamically -->
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-lg mb-4">
                    <span>Total:</span>
                    <span id="cart-total">₹0</span>
                </div>
                <button onclick="proceedToCheckout()" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold hover:bg-green-700 transition shadow">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t mt-16 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 GreenLifeStores. All rights reserved. Built with FastAPI & Tailwind CSS.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem("greenlife_cart")) || [];

        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                console.error("Error fetching products:", error);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No products found.</p>`;
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col">
                        <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <span class="text-xs uppercase tracking-wider text-green-600 font-semibold mb-1">${p.category}</span>
                            <h3 class="font-bold text-lg text-gray-800 mb-2">${p.name}</h3>
                            <p class="text-gray-600 text-sm mb-4 flex-grow">${p.description}</p>
                            <div class="flex items-center justify-between mt-auto">
                                <span class="text-xl font-extrabold text-green-700">₹${p.price}</span>
                                <button onclick="addToCart(${p.id})" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-green-700 transition shadow">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-green-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-green-600', 'text-white');

            if (category === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            saveCart();
            updateCartUI();
            openCartModal();
        }

        function saveCart() {
            localStorage.setItem("greenlife_cart", JSON.stringify(cart));
        }

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const itemsElem = document.getElementById('cart-items');
            const totalElem = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            countElem.innerText = totalCount;

            if (cart.length === 0) {
                itemsElem.innerHTML = `<p class="text-gray-500 text-center py-8">Your cart is empty.</p>`;
                totalElem.innerText = "₹0";
                return;
            }

            itemsElem.innerHTML = '';
            let totalAmount = 0;

            cart.forEach((item, index) => {
                totalAmount += item.price * item.qty;
                itemsElem.innerHTML += `
                    flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-500">₹${item.price} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${index}, -1)" class="bg-gray-200 px-2 py-1 rounded text-xs font-bold">-</button>
                            <span class="text-sm font-semibold">${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)" class="bg-gray-200 px-2 py-1 rounded text-xs font-bold">+</button>
                            <button onclick="removeItem(${index})" class="text-red-500 ml-2 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            totalElem.innerText = `₹${totalAmount}`;
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
            updateCartUI();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function openCartModal() {
            document.getElementById('cart-modal').classList.remove('hidden');
            updateCartUI();
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            window.location.href = "account.html";
        }

        window.onload = fetchProducts;
    </script>
</body>
</html>
