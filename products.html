<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | GreenLifeStores</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-emerald-50/40 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="products.html" class="text-xl font-bold text-green-700 flex items-center gap-2">
                <i class="fa-solid fa-leaf text-green-600"></i> GreenLifeStores
            </a>
            <nav class="hidden md:flex gap-6 font-medium text-gray-600 text-sm">
                <a href="products.html" class="text-green-600 font-semibold">Shop</a>
                <a href="about.html" class="hover:text-green-600 transition">About</a>
                <a href="account.html" class="hover:text-green-600 transition">Account</a>
                <a href="admin.html" class="hover:text-green-600 transition">Admin</a>
            </nav>
            <div class="flex items-center gap-4">
                <button onclick="openCartModal()" class="relative bg-green-600 text-white px-3.5 py-1.5 rounded-lg hover:bg-green-700 transition flex items-center gap-2 text-sm font-medium shadow-sm">
                    <i class="fa-solid fa-cart-shopping"></i> Cart 
                    <span id="cart-count" class="bg-white text-green-700 font-bold px-1.5 py-0.5 rounded-full text-xs">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Shop Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Hero Section -->
        <div class="bg-gradient-to-r from-green-700 to-emerald-800 text-white rounded-2xl p-6 mb-6 text-center shadow-md">
            <h1 class="text-2xl md:text-3xl font-bold mb-1">Sustainable & Organic Lifestyle</h1>
            <p class="text-green-100 max-w-lg mx-auto text-xs md:text-sm">Handcrafted clay, terracotta, and bamboo collection for healthy living.</p>
        </div>

        <!-- Category Filter Buttons -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="filterCategory('all')" class="category-btn active px-4 py-1.5 rounded-full bg-green-600 text-white text-xs font-medium shadow transition">All Products</button>
            <button onclick="filterCategory('soil')" class="category-btn px-4 py-1.5 rounded-full bg-white text-gray-700 text-xs font-medium border border-gray-200 shadow-sm hover:bg-green-50 transition">Clay & Soil</button>
            <button onclick="filterCategory('care')" class="category-btn px-4 py-1.5 rounded-full bg-white text-gray-700 text-xs font-medium border border-gray-200 shadow-sm hover:bg-green-50 transition">Personal Care</button>
            <button onclick="filterCategory('decor')" class="category-btn px-4 py-1.5 rounded-full bg-white text-gray-700 text-xs font-medium border border-gray-200 shadow-sm hover:bg-green-50 transition">Home Decor</button>
            <button onclick="filterCategory('kitchen')" class="category-btn px-4 py-1.5 rounded-full bg-white text-gray-700 text-xs font-medium border border-gray-200 shadow-sm hover:bg-green-50 transition">Kitchenware</button>
        </div>

        <!-- Products Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
            <!-- Products rendered here via JavaScript -->
        </div>
    </main>

    <!-- Product Details Modal (Popup on Image/Card Click) -->
    <div id="product-details-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden relative flex flex-col max-h-[90vh]">
            <button onclick="closeProductDetailsModal()" class="absolute top-3 right-3 bg-gray-100 hover:bg-red-100 text-gray-500 hover:text-red-600 w-8 h-8 rounded-full flex items-center justify-center text-lg font-bold transition z-10">&times;</button>
            
            <div id="modal-product-content" class="overflow-y-auto p-6">
                <!-- Details populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Cart Drawer Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-green-600"></i> Your Shopping Cart</h2>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-grow space-y-3 mb-4">
                <!-- Cart items rendered dynamically -->
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between font-bold text-base mb-4">
                    <span>Total:</span>
                    <span id="cart-total">₹0</span>
                </div>
                <button onclick="proceedToCheckout()" class="w-full bg-green-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-green-700 transition shadow">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12 py-4 text-center text-gray-400 text-xs">
        <p>&copy; 2026 GreenLifeStores. All rights reserved.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem("greenlife_cart")) || [];

        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                console.error("Error fetching products:", error);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No products found.</p>`;
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition duration-200 flex flex-col border border-gray-100 overflow-hidden group">
                        
                        <!-- Fixed Compact Image Container (Height h-32 = 128px, object-contain) -->
                        <div onclick="openProductDetails(${p.id})" class="h-32 w-full bg-gray-50 flex items-center justify-center p-2 cursor-pointer overflow-hidden relative border-b border-gray-100">
                            <img src="${p.image}" alt="${p.name}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=GreenLife';">
                            <span class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm text-[10px] text-gray-600 px-2 py-0.5 rounded-full font-medium opacity-0 group-hover:opacity-100 transition">Details</span>
                        </div>
                        
                        <div class="p-3 flex flex-col flex-grow">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-green-600 mb-0.5">${p.category}</span>
                            
                            <!-- Clickable Title & Description -->
                            <h3 onclick="openProductDetails(${p.id})" class="font-bold text-xs text-gray-800 mb-1 leading-snug cursor-pointer hover:text-green-700 transition line-clamp-1">${p.name}</h3>
                            <p onclick="openProductDetails(${p.id})" class="text-gray-500 text-[11px] mb-2 flex-grow line-clamp-2 cursor-pointer hover:text-gray-700 transition leading-tight" title="Click for details">${p.description}</p>
                            
                            <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-100">
                                <span class="text-sm font-black text-green-700">₹${p.price}</span>
                                <button onclick="addToCart(${p.id})" class="bg-green-600 text-white px-2.5 py-1 rounded-md text-[11px] font-bold hover:bg-green-700 transition shadow-sm">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openProductDetails(productId) {
            const p = allProducts.find(item => item.id === productId);
            if (!p) return;

            const modalContent = document.getElementById('modal-product-content');
            modalContent.innerHTML = `
                <div class="w-full h-56 bg-gray-50 rounded-xl flex items-center justify-center p-4 mb-4 border border-gray-100">
                    <img src="${p.image}" alt="${p.name}" class="max-h-full max-w-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=GreenLife';">
                </div>
                <span class="text-xs font-bold uppercase tracking-wider text-green-600 bg-green-50 px-2.5 py-1 rounded-full">${p.category}</span>
                <h2 class="text-xl font-bold text-gray-800 mt-2 mb-2">${p.name}</h2>
                <div class="text-2xl font-black text-green-700 mb-4">₹${p.price}</div>
                <div class="border-t pt-3 mb-6">
                    <h4 class="text-xs font-bold uppercase text-gray-400 mb-1">Product Description</h4>
                    <p class="text-sm text-gray-600 leading-relaxed">${p.description}</p>
                </div>
                <button onclick="addToCart(${p.id}); closeProductDetailsModal();" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Add to Cart (₹${p.price})
                </button>
            `;

            document.getElementById('product-details-modal').classList.remove('hidden');
        }

        function closeProductDetailsModal() {
            document.getElementById('product-details-modal').classList.add('hidden');
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-green-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700', 'border');
            });
            event.target.classList.remove('bg-white', 'text-gray-700', 'border');
            event.target.classList.add('bg-green-600', 'text-white');

            if (category === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            saveCart();
            updateCartUI();
            openCartModal();
        }

        function saveCart() {
            localStorage.setItem("greenlife_cart", JSON.stringify(cart));
        }

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const itemsElem = document.getElementById('cart-items');
            const totalElem = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            countElem.innerText = totalCount;

            if (cart.length === 0) {
                itemsElem.innerHTML = `<p class="text-gray-400 text-center py-6 text-sm">Your cart is empty.</p>`;
                totalElem.innerText = "₹0";
                return;
            }

            itemsElem.innerHTML = '';
            let totalAmount = 0;

            cart.forEach((item, index) => {
                totalAmount += item.price * item.qty;
                itemsElem.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border">
                        <div>
                            <h4 class="font-bold text-gray-800 text-xs">${item.name}</h4>
                            <p class="text-[11px] text-gray-500">₹${item.price} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="changeQty(${index}, -1)" class="bg-gray-200 px-2 py-0.5 rounded text-xs font-bold">-</button>
                            <span class="text-xs font-semibold px-1">${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)" class="bg-gray-200 px-2 py-0.5 rounded text-xs font-bold">+</button>
                            <button onclick="removeItem(${index})" class="text-red-500 ml-1 hover:text-red-700 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            totalElem.innerText = `₹${totalAmount}`;
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
            updateCartUI();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function openCartModal() {
            document.getElementById('cart-modal').classList.remove('hidden');
            updateCartUI();
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            window.location.href = "account.html";
        }

        window.onload = fetchProducts;
    </script>
</body>
</html>
