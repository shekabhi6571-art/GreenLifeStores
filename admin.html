<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GreenLifeStores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="products.html" class="text-2xl font-bold text-green-400 flex items-center gap-2">
                <i class="fa-solid fa-leaf"></i> GreenLife Admin
            </a>
            <nav class="flex gap-6 font-medium text-gray-300">
                <a href="products.html" class="hover:text-green-400">View Store</a>
                <a href="admin.html" class="text-green-400 font-semibold">Orders Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-list-check text-green-600 mr-2"></i> All Customer Orders</h1>
                <button onclick="fetchAdminOrders()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700"><i class="fa-solid fa-rotate mr-1"></i> Refresh</button>
            </div>

            <div id="admin-orders-list" class="space-y-4">
                <p class="text-gray-500 text-center py-8">Loading live orders...</p>
            </div>
        </div>
    </main>

    <script>
        async function fetchAdminOrders() {
            try {
                const response = await fetch('/api/customer/orders');
                const orders = await response.json();
                const container = document.getElementById('admin-orders-list');

                if (!orders || orders.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 text-center py-8">No customer orders recorded yet.</p>`;
                    return;
                }

                container.innerHTML = orders.slice().reverse().map(order => `
                    <div class="border border-gray-200 p-5 rounded-xl bg-gray-50 shadow-sm">
                        <div class="flex flex-wrap justify-between items-center border-b border-gray-300 pb-3 mb-3">
                            <div>
                                <span class="font-bold text-gray-800 text-lg">Order ID: #${order.id}</span>
                                <p class="text-xs text-gray-500">Customer Name: <strong>${order.customer_name || 'N/A'}</strong> | Phone: <strong>${order.phone || 'N/A'}</strong></p>
                            </div>
                            <span class="text-xl font-extrabold text-green-700">Total: ₹${order.total}</span>
                        </div>
                        <p class="text-sm text-gray-700 mb-3"><strong>Shipping Address:</strong> ${order.address}</p>
                        
                        <div class="bg-white p-4 rounded-lg border border-gray-200">
                            <h4 class="font-bold text-xs uppercase text-gray-500 mb-2">Purchased Items:</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-sm">
                                ${order.items.map(i => `
                                    <div class="bg-green-50 p-2 rounded border border-green-100 flex justify-between">
                                        <span>${i.name}</span>
                                        <span class="font-bold text-green-800">x${i.quantity}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error fetching admin orders:", err);
            }
        }

        window.onload = fetchAdminOrders;
    </script>
</body>
</html>
